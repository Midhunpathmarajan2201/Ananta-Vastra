function openBillForm(billId=''){
 if(!ensureOnline())return;const existing=billId?state.bills.find(b=>b.id===billId):null;if(existing&&!admin())return toast('Only Admin can correct a saved paper bill');if(existing&&existing.status!=='posted')return toast('Cancelled bill cannot be edited');billLineCount=0;
 const b=existing||{paperNo:'',date:today(),customerName:'',phone:'',soldBy:admin()?state.employees.find(e=>e.active)?.id:state.employeeId,items:[],cash:0,upi:0,finalAmount:0,discount:0};
 const lineItems=existing?b.items.map(i=>({productId:i.productId,categoryId:i.categoryId,variantId:i.variantId,qty:i.qty,unitPrice:i.unitPrice})):[];
 openModal(`<div class="modalhead"><div><h2>${existing?'Admin correction · paper bill':'Enter physical paper bill'}</h2><div class="sub">${existing?'Correct an existing paper-bill entry. Stock differences are adjusted and audited.':'Record the bill already written in the physical bill pad. No customer receipt is generated here.'}</div></div><button class="close" onclick="closeModal()">×</button></div>
 ${!existing?'<div class="notice blue">The bill has already been issued on paper. Enter its reference and products below. Sales cannot edit the record after saving; Admin handles corrections.</div>':'<div class="notice">Admin corrections are recorded with a reason. Any quantity reduction is recorded as returned stock and classified below.</div>'}
 <form id="billForm" onsubmit="saveBill(event,'${existing?.id||''}')"><div class="formgrid">
 <div class="field"><label>Physical bill number *</label><input class="input" name="paperNo" required value="${esc(b.paperNo)}" placeholder="e.g. AV-128"></div>
 <div class="field"><label>Original paper bill date *</label><input class="input" type="date" name="date" required value="${esc(String(b.date||today()).slice(0,10))}"></div>
 <div class="field"><label>Customer name *</label><input class="input" name="customerName" required value="${esc(b.customerName)}" placeholder="Enter customer name" autocomplete="off" list="customerNameList"><datalist id="customerNameList">${customerGroups().flatMap(c=>c.names).map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
 <div class="field"><label>Customer contact number (optional)</label><input class="input" name="phone" inputmode="tel" value="${esc(b.phone||'')}" placeholder="10-digit mobile number" oninput="showPhoneAliases(this.value)"></div>
 <div class="field full"><div id="phoneAliasHint" class="help">Same mobile number can be associated with multiple customer names. The exact name on this bill will be preserved.</div></div>
 <div class="field"><label>Sold by employee *</label><select class="select" name="soldBy" ${!admin()?'disabled':''}>${admin()?employeeOptions(b.soldBy):`<option value="${state.employeeId}">${esc(employee().name)}</option>`}</select>${!admin()?`<input type="hidden" name="soldBy" value="${state.employeeId}">`:''}</div>
 <div class="field"><label>Entered by</label><input class="input" value="${esc(actor())}" disabled></div>
 </div>
 <div class="divider"></div><div class="panelhead"><div><b>Products recorded on paper bill</b><div class="panelhint">Category, product, variant, quantity and actual unit price</div></div><button type="button" class="btn small" onclick="addBillLine()">＋ Add product line</button></div>
 <div id="billLines">${lineItems.map(x=>billLineHtml(x)).join('')}</div>
 <div class="divider"></div><div class="formgrid">
 <div class="field"><label>Payment method *</label><select class="select" name="paymentMode" onchange="paymentModeChanged(this.value)"><option value="Cash" ${b.cash>0&&b.upi===0?'selected':''}>Cash</option><option value="UPI" ${b.upi>0&&b.cash===0?'selected':''}>UPI</option><option value="Split" ${b.cash>0&&b.upi>0?'selected':''}>Split Cash + UPI</option></select></div>
 <div class="field"><label>Final bill amount ₹ *</label><input class="input" type="number" name="finalAmount" id="finalAmount" step=".01" min="0" value="${b.finalAmount||0}" data-touched="${existing&&b.amountOverride?'1':''}" required oninput="billAmountChanged()"></div>
 <div class="field ${admin()?'':'hidden'}"><label>Admin discount ₹</label><input class="input" name="discount" id="billDiscount" type="number" min="0" step=".01" value="${b.discount||0}" oninput="calcBillForm()"></div>
 <div class="field"><label>Calculated item subtotal ₹</label><input class="input" id="billSubtotal" value="${b.subtotal||0}" disabled></div>
 <div class="field ${existing?'':'hidden'}"><label>Stock returned condition</label><select class="select" name="returnCondition"><option value="saleable">Saleable – restore to available stock</option><option value="pending">Pending inspection – not available for sale</option><option value="damaged">Damaged – keep out of available stock</option></select></div>
 <div class="field ${existing?'':'hidden'}"><label>Correction reason *</label><input class="input" name="correctionReason" ${existing?'required':''} placeholder="e.g. Customer returned one piece"></div>
 </div>
 <div class="formgrid" id="paymentSplit" style="margin-top:11px;${b.cash>0&&b.upi>0?'':'display:none'}"><div class="field"><label>Cash received ₹</label><input class="input" name="cash" type="number" min="0" step=".01" value="${b.cash||0}" oninput="syncSplitTotal()"></div><div class="field"><label>UPI received ₹</label><input class="input" name="upi" type="number" min="0" step=".01" value="${b.upi||0}" oninput="syncSplitTotal()"></div></div>
 <div class="notice" style="margin-top:12px">The bill amount may be overridden to match the physical bill. Price and amount changes are recorded in the bill audit history. Admin discounts are separate from Sales price overrides.</div>
 <div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">${existing?'Save Admin correction':'Save paper bill entry'}</button></div></form>`);
 if(!existing&&lineItems.length===0)addBillLine();calcBillForm();
}
function showPhoneAliases(phone){const el=$('#phoneAliasHint');if(!el)return;const normalized=phone.replace(/\D/g,'');const c=customerGroups().find(x=>x.phone.replace(/\D/g,'')===normalized&&normalized.length>=7);el.textContent=c?`Existing names for this number: ${c.names.join(', ')}. You can select a saved name or enter a new name; the bill keeps the exact name entered.`:'Same mobile number can be associated with multiple customer names. The exact name on this bill will be preserved.'}
function paymentModeChanged(v){const box=$('#paymentSplit');if(box)box.style.display=v==='Split'?'grid':'none';if(v==='Cash'){$('[name=cash]').value=$('#finalAmount').value||0;$('[name=upi]').value=0}else if(v==='UPI'){$('[name=cash]').value=0;$('[name=upi]').value=$('#finalAmount').value||0}}
function calcBillForm(){const rows=$$('#billLines .billline');let sum=0;rows.forEach(r=>{sum+=Number(r.querySelector('[name=qty]').value||0)*Number(r.querySelector('[name=unitPrice]').value||0)});const sub=$('#billSubtotal');if(sub)sub.value=sum.toFixed(2);const dis=Number($('#billDiscount')?.value||0);const final=$('#finalAmount');if(final&&!final.dataset.touched)final.value=Math.max(0,sum-dis).toFixed(2);const mode=$('[name=paymentMode]')?.value;if(mode==='Cash'&&$('[name=cash]'))$('[name=cash]').value=final?.value||0;if(mode==='UPI'&&$('[name=upi]'))$('[name=upi]').value=final?.value||0;return sum}
function billAmountChanged(){const f=$('#finalAmount');if(f)f.dataset.touched='1';const mode=$('[name=paymentMode]')?.value;if(mode==='Cash'&&$('[name=cash]'))$('[name=cash]').value=f.value;if(mode==='UPI'&&$('[name=upi]'))$('[name=upi]').value=f.value}
function syncSplitTotal(){const c=Number($('[name=cash]')?.value||0),u=Number($('[name=upi]')?.value||0);$('#finalAmount').value=(c+u).toFixed(2);$('#finalAmount').dataset.touched='1'}
function saveBill(e,billId){e.preventDefault();if(!ensureOnline())return;const existing=billId?state.bills.find(b=>b.id===billId):null;if(existing&&!admin())return toast('Only Admin can correct a saved bill');const f=new FormData(e.target);const paperNo=String(f.get('paperNo')||'').trim();if(!paperNo)return toast('Physical bill number is required');if(state.bills.some(b=>b.paperNo.toLowerCase()===paperNo.toLowerCase()&&b.id!==billId))return toast('This physical bill number already exists');const customerName=String(f.get('customerName')||'').trim();if(!customerName)return toast('Customer name is required');const phone=String(f.get('phone')||'').trim();if(phone&&!/^[+0-9\s()-]{7,18}$/.test(phone))return toast('Check the customer contact number');const rows=$$('#billLines .billline');if(!rows.length)return toast('Add at least one product');const items=[];for(const r of rows){const vId=r.querySelector('[name=variantId]').value,found=variant(vId),qty=Number(r.querySelector('[name=qty]').value),price=Number(r.querySelector('[name=unitPrice]').value);if(!found.v||!found.p||!Number.isInteger(qty)||qty<1||price<0||String(r.querySelector('[name=color]').value)!==(found.v.color||'')||String(r.querySelector('[name=size]').value)!==(found.v.size||''))return toast('Select a valid Admin-created colour and size combination');items.push({variantId:vId,productId:found.p.id,categoryId:found.p.categoryId,categoryName:cat(found.p.categoryId)?.name||'',productName:found.p.name,code:found.p.code,color:found.v.color,size:found.v.size,qty,unitPrice:price,costSnapshot:existing?(existing.items.find(old=>old.variantId===vId)?.costSnapshot??(found.v.buy==null?null:Number(found.v.buy))):(found.v.buy==null?null:Number(found.v.buy))})}
 const subtotal=items.reduce((s,x)=>s+x.qty*x.unitPrice,0),discount=admin()?Number(f.get('discount')||0):0,finalAmount=Number(f.get('finalAmount'));if(discount<0||discount>subtotal||finalAmount<0||!Number.isFinite(finalAmount))return toast('Check discount and final amount');const mode=String(f.get('paymentMode'));let cash=0,upi=0;if(mode==='Cash')cash=finalAmount;else if(mode==='UPI')upi=finalAmount;else{cash=Number(f.get('cash')||0);upi=Number(f.get('upi')||0);if(Math.abs(cash+upi-finalAmount)>.009)return toast('Cash + UPI must equal the final bill amount')}
 const soldBy=admin()?String(f.get('soldBy')||''):state.employeeId;const oldItems=existing?existing.items:[];const returnedCondition=String(f.get('returnCondition')||'saleable');const newMap={},oldMap={};items.forEach(x=>newMap[x.variantId]=(newMap[x.variantId]||0)+x.qty);oldItems.forEach(x=>oldMap[x.variantId]=(oldMap[x.variantId]||0)+x.qty);
 if(existing){const ids=new Set([...Object.keys(oldMap),...Object.keys(newMap)]);for(const vid of ids){const delta=(newMap[vid]||0)-(oldMap[vid]||0),found=variant(vid);if(!found.v)return toast('A product variant referenced by this bill is unavailable');if(delta>0&&found.v.stock<delta)return toast(`Insufficient stock for ${found.p.name} · ${vLabel(found.v)}. Available ${found.v.stock}`)} }
 else {for(const x of items){const v=variant(x.variantId).v;if(v.stock<x.qty)return toast(`Insufficient stock for ${x.productName} · ${vLabel(v)}. Available ${v.stock}`)}}
 const timestamp=new Date().toISOString();
 if(existing){const before={paperNo:existing.paperNo,customerName:existing.customerName,finalAmount:existing.finalAmount,items:JSON.parse(JSON.stringify(existing.items))};const ids=new Set([...Object.keys(oldMap),...Object.keys(newMap)]);for(const vid of ids){const delta=(newMap[vid]||0)-(oldMap[vid]||0),found=variant(vid);if(delta>0){found.v.stock-=delta;state.movements.unshift({id:id(),variantId:vid,productId:found.p.id,qty:-delta,type:'Bill correction – additional sale',reason:String(f.get('correctionReason')),by:actor(),at:timestamp})}else if(delta<0){const q=-delta;if(returnedCondition==='saleable')found.v.stock+=q;else if(returnedCondition==='damaged')found.v.damaged+=q;else found.v.pending+=q;state.movements.unshift({id:id(),variantId:vid,productId:found.p.id,qty:q,type:'Admin bill correction / returned goods',reason:`${String(f.get('correctionReason'))} · ${returnedCondition}`,by:actor(),at:timestamp})}}
 existing.paperNo=paperNo;existing.date=String(f.get('date'));existing.customerName=customerName;existing.phone=phone;existing.soldBy=soldBy;existing.items=items;existing.subtotal=subtotal;existing.discount=discount;existing.finalAmount=finalAmount;existing.cash=cash;existing.upi=upi;existing.amountOverride=Math.abs(finalAmount-(subtotal-discount))>.009;existing.updatedBy=admin()?'Admin':state.employeeId;existing.updatedAt=timestamp;existing.history??=[];existing.history.unshift({at:timestamp,by:actor(),reason:String(f.get('correctionReason')),before,after:{finalAmount,items:JSON.parse(JSON.stringify(items))}});log('Paper bill corrected',`${paperNo} · ${String(f.get('correctionReason'))}`);notify('Paper bill corrected',`${paperNo} corrected by ${actor()}. Updated amount ${rupee(finalAmount)}.`)
 }else{for(const x of items){const v=variant(x.variantId).v;v.stock-=x.qty;state.movements.unshift({id:id(),variantId:v.id,productId:x.productId,qty:-x.qty,type:'Paper bill sale',reason:`Paper bill ${paperNo}`,by:actor(),at:timestamp})}const b={id:id(),paperNo,date:String(f.get('date')),customerName,phone,soldBy,enteredBy:admin()?'Admin':state.employeeId,enteredAt:timestamp,items,subtotal,discount,finalAmount,cash,upi,amountOverride:Math.abs(finalAmount-(subtotal-discount))>.009,status:'posted',createdBy:admin()?'Admin':state.employeeId,updatedBy:admin()?'Admin':state.employeeId,history:[]};state.bills.unshift(b);log('Paper bill entered',`${paperNo} · ${customerName} · ${rupee(finalAmount)}`);notify('New paper bill entered',`${paperNo} entered by ${actor()} · ${customerName} · ${rupee(finalAmount)}.`)}
 // Customer names are intentionally retained per bill; customer grouping is derived by phone.
 for(const x of items){const v=variant(x.variantId).v;if(v.stock<=v.min&&state.settings.lowStockNotifications){notify('Low stock alert',`${x.productName} · ${vLabel(v)} now has ${v.stock} pieces.`)}}
 persistRender();closeModal();toast(existing?'Admin correction saved; inventory updated':'Paper bill saved; inventory deducted')}
function openBillDetail(bid){const b=state.bills.find(x=>x.id===bid);if(!b)return;selectedBill=bid;const items=b.items.map(x=>`<tr><td>${esc(x.categoryName)}</td><td><b>${esc(x.productName)}</b><div class="tiny muted">${esc(x.code)}</div></td><td>${esc(x.color||'—')}</td><td>${esc(x.size||'—')}</td><td>${x.qty}</td><td>${rupee(x.unitPrice)}</td><td>${rupee(x.qty*x.unitPrice)}</td></tr>`).join('');openModal(`<div class="modalhead"><div><div class="eyebrow">PAPER BILL RECORD</div><h2>${esc(b.paperNo)} · ${esc(b.customerName)}</h2><div class="sub">Original bill date ${fmtDate(b.date)} · Entered ${fmtDateTime(b.enteredAt)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="grid3"><div class="amountbox"><div class="tiny muted">Final amount</div><div class="metricvalue" style="font-size:21px">${rupee(b.finalAmount)}</div></div><div class="amountbox"><div class="tiny muted">Payment</div><b>${paymentLabel(b)}</b><div class="tiny muted">Cash ${rupee(b.cash)} · UPI ${rupee(b.upi)}</div></div><div class="amountbox"><div class="tiny muted">Status</div><span class="tag ${b.status==='posted'?'green':'gray'}">${b.status}</span></div></div><div class="divider"></div><div class="formgrid"><div><div class="tiny muted">Customer contact</div><b>${esc(b.phone||'Not provided')}</b></div><div><div class="tiny muted">Sold by</div><b>${esc(nameOf(b.soldBy))}</b></div><div><div class="tiny muted">Entered by</div><b>${esc(nameOf(b.enteredBy))}</b></div><div><div class="tiny muted">Last updated by</div><b>${esc(nameOf(b.updatedBy))}</b></div></div><div class="divider"></div><div class="paneltitle" style="margin-bottom:9px">Bill line details</div><div class="tablewrap"><table><thead><tr><th>Category</th><th>Product</th><th>Colour</th><th>Size</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead><tbody>${items}</tbody></table></div><div class="sumrow" style="margin-top:12px"><span>Subtotal</span><b>${rupee(b.subtotal)}</b></div>${b.discount?`<div class="sumrow"><span>Admin discount</span><b>− ${rupee(b.discount)}</b></div>`:''}<div class="sumrow total"><span>Recorded bill amount</span><span>${rupee(b.finalAmount)}</span></div>${b.amountOverride?'<div class="tiny muted">Final amount override recorded in audit history.</div>':''}${b.history?.length?`<div class="divider"></div><b>Correction history</b>${b.history.map(h=>`<div class="listitem"><div class="listgrow"><div class="listtitle">${esc(h.reason||'Bill correction')}</div><div class="listdesc">${esc(nameOf(h.by))} · ${fmtDateTime(h.at)}</div></div><b>${rupee(h.after.finalAmount)}</b></div>`).join('')}`:''}<div class="modalactions">${admin()&&b.status==='posted'?`<button class="btn" onclick="openBillForm('${b.id}')">Correct bill</button><button class="btn danger" onclick="cancelBill('${b.id}')">Cancel bill</button>`:''}<button class="btn primary" onclick="closeModal()">Close</button></div>`)}
function cancelBill(bid){if(!admin()||!ensureOnline())return;const b=state.bills.find(x=>x.id===bid);if(!b||b.status!=='posted')return;if(!confirm(`Cancel ${b.paperNo}? Its recorded saleable quantities will be restored to inventory. Original history is retained.`))return;b.items.forEach(x=>{const v=variant(x.variantId).v;if(v){v.stock+=x.qty;state.movements.unshift({id:id(),variantId:v.id,productId:x.productId,qty:x.qty,type:'Cancelled bill – stock restored',reason:`Bill ${b.paperNo} cancelled`,by:actor(),at:new Date().toISOString()})}});b.status='cancelled';b.cancelledAt=new Date().toISOString();b.cancelledBy='Admin';b.history??=[];b.history.unshift({at:b.cancelledAt,by:'Admin',reason:'Bill cancelled by Admin',before:{finalAmount:b.finalAmount},after:{finalAmount:b.finalAmount}});log('Bill cancelled',b.paperNo);notify('Bill cancelled',`${b.paperNo} cancelled by Admin. Eligible stock restored.`);persistRender();closeModal();toast('Bill cancelled; stock restored')}
function openBillsForRange(preset){billFilter=preset==='day'?'today':'all';nav('sales')}
function customerGroups(){const map=new Map();for(const b of allPosted()){if(!b.phone){const k='nop:'+b.id;map.set(k,{key:k,phone:'',names:[b.customerName],bills:[b]});continue}const phone=b.phone.replace(/\D/g,'');if(!phone)continue;const k='phone:'+phone;if(!map.has(k))map.set(k,{key:k,phone:b.phone,names:[],bills:[]});const c=map.get(k);if(!c.names.includes(b.customerName))c.names.push(b.customerName);c.bills.push(b)}return [...map.values()].sort((a,b)=>a.names[0].localeCompare(b.names[0]))}
function customersPage(){const groups=customerGroups();const q=(window.customerSearch||'').toLowerCase();const shown=groups.filter(c=>(c.names.join(' ')+' '+c.phone).toLowerCase().includes(q));return `${header('Customers','Phone number is the grouping key. Different names entered with the same mobile number are retained as aliases.',admin()?'<button class="btn" onclick="exportCustomers()">Export customers</button>':'')}<div class="notice blue">Customer name is saved exactly as written on each paper bill. When the same mobile number appears with a different name, both names remain linked to that number. Purchase history is visible to Admin only.</div><div class="toolbar"><input class="input" style="max-width:350px" placeholder="Search name or mobile number" value="${esc(window.customerSearch||'')}" oninput="window.customerSearch=this.value;renderCustomerTable()"></div><div id="customerList">${customerList(shown)}</div>`}
function customerList(arr){if(!arr.length)return '<div class="empty">No customer records found. Customer records are created when a paper bill is entered.</div>';return `<div class="grid2">${arr.map(c=>`<section class="panel"><div class="panelhead"><div><div class="paneltitle">${esc(c.names[0]||'Customer')}</div><div class="panelhint">${esc(c.phone||'No phone number')}</div></div><span class="tag">${c.bills.length} bills</span></div><div class="tiny muted">Names associated with this number</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 10px">${c.names.map(n=>`<span class="tag">${esc(n)}</span>`).join('')}</div>${admin()?`<div class="sumrow"><span>Total purchase value</span><b>${rupee(c.bills.reduce((s,b)=>s+b.finalAmount,0))}</b></div><div class="divider"></div><b class="tiny">Purchase history</b>${c.bills.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(b=>`<div class="listitem" onclick="openBillDetail('${b.id}')" style="cursor:pointer"><div class="listgrow"><div class="listtitle">${esc(b.paperNo)} · ${fmtDate(b.date)}</div><div class="listdesc">${b.items.reduce((s,x)=>s+x.qty,0)} pieces · ${esc(b.items.map(x=>x.productName).join(', '))}</div></div><b>${rupee(b.finalAmount)}</b></div>`).join('')}`:`<div class="muted tiny">Customer names and contact are available for reference. Purchase history is restricted to Admin.</div>`}</section>`).join('')}</div>`}
function renderCustomerTable(){const el=$('#customerList');if(el)el.innerHTML=customerList(customerGroups().filter(c=>(c.names.join(' ')+' '+c.phone).toLowerCase().includes((window.customerSearch||'').toLowerCase())))}
function suppliersPage(){if(!admin())return accessDenied();const q=(window.supplierSearch||'').toLowerCase();const arr=state.suppliers.filter(s=>(s.name+' '+s.phone+' '+s.address).toLowerCase().includes(q));return `${header('Suppliers','Supplier directory, contacts, purchase invoices, purchase history and outstanding balances.',`<button class="btn primary" onclick="openSupplierForm()">＋ Add supplier</button>`)}<div class="cards"><div class="metric"><div class="metriclabel">Suppliers</div><div class="metricvalue">${state.suppliers.length}</div></div><div class="metric"><div class="metriclabel">Purchase invoices</div><div class="metricvalue">${state.supplierInvoices.length}</div></div><div class="metric"><div class="metriclabel">Total outstanding</div><div class="metricvalue">${rupee(state.supplierInvoices.reduce((s,x)=>s+Math.max(0,x.total-x.paid),0))}</div></div><div class="metric"><div class="metriclabel">Total invoiced</div><div class="metricvalue">${rupee(state.supplierInvoices.reduce((s,x)=>s+x.total,0))}</div></div></div><div class="toolbar"><input class="input" style="max-width:320px" placeholder="Search suppliers" value="${esc(window.supplierSearch||'')}" oninput="window.supplierSearch=this.value;renderSupplierList()"><button class="btn" onclick="openSupplierInvoice()">＋ Purchase invoice</button></div><div id="supplierList">${supplierList(arr)}</div><div class="notice">Supplier invoices and outstanding balances are maintained in Supplier Management. The Cashbook remains focused on Cash/UPI bill collections and general shop expenses, as approved.</div>`}
function supplierList(arr){if(!arr.length)return '<div class="empty">No suppliers added yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>Supplier</th><th>Contact</th><th>Invoices</th><th>Invoiced</th><th>Outstanding</th><th>Action</th></tr></thead><tbody>${arr.map(s=>{const inv=state.supplierInvoices.filter(x=>x.supplierId===s.id),total=inv.reduce((n,x)=>n+x.total,0),due=inv.reduce((n,x)=>n+Math.max(0,x.total-x.paid),0);return `<tr><td class="strong">${esc(s.name)}</td><td>${esc(s.phone||'—')}</td><td>${inv.length}</td><td>${rupee(total)}</td><td class="${due?'low':'positive'}">${rupee(due)}</td><td><button class="btn small" onclick="openSupplierDetail('${s.id}')">View</button></td></tr>`}).join('')}</tbody></table></div>`}
function renderSupplierList(){const el=$('#supplierList');if(el)el.innerHTML=supplierList(state.suppliers.filter(s=>(s.name+' '+s.phone+' '+s.address).toLowerCase().includes((window.supplierSearch||'').toLowerCase())))}
function openSupplierForm(){if(!admin())return;openModal(`<div class="modalhead"><div><h2>Add supplier</h2><div class="sub">Maintain supplier contact details and purchase history.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSupplier(event)"><div class="formgrid"><div class="field"><label>Supplier name *</label><input class="input" name="name" required></div><div class="field"><label>Phone</label><input class="input" name="phone"></div><div class="field"><label>Email</label><input class="input" name="email" type="email"></div><div class="field"><label>Address</label><input class="input" name="address"></div><div class="field full"><label>Notes</label><textarea class="textarea" name="notes"></textarea></div></div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save supplier</button></div></form>`)}
function saveSupplier(e){e.preventDefault();if(!admin()||!ensureOnline())return;const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;const s={id:id(),name,phone:String(f.get('phone')),email:String(f.get('email')),address:String(f.get('address')),notes:String(f.get('notes'))};state.suppliers.unshift(s);log('Supplier created',name);persistRender();closeModal();toast('Supplier added')}
function purchaseLineHtml(){const ps=activeProducts();const p=ps[0];return `<div class="billline purchase-line"><div class="field"><label>Product</label><select class="select" name="productId" onchange="purchaseProductChanged(this)">${ps.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Variant</label><select class="select" name="variantId">${p?stockVariantOptionsHtml(p.id):''}</select></div><div class="field"><label>Qty received</label><input class="input" name="qty" type="number" min="1" step="1" value="1" oninput="calcPurchaseTotal()"></div><div class="field"><label>Unit purchase ₹</label><input class="input" name="unitCost" type="number" min="0" step=".01" value="${p?variant(p.variants[0]?.id).v?.buy??0:0}" oninput="calcPurchaseTotal()"></div><button class="btn small danger" type="button" onclick="this.closest('.purchase-line').remove();calcPurchaseTotal()">Remove</button></div>`}
function openSupplierInvoice(){if(!admin())return;if(!state.suppliers.length)return toast('Add a supplier first');if(!activeProducts().length)return toast('Create products before linking a purchase invoice to inventory');openModal(`<div class="modalhead"><div><h2>Record purchase invoice</h2><div class="sub">Record supplier invoice, received variants, purchase costs and outstanding balance.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSupplierInvoice(event)"><div class="formgrid"><div class="field"><label>Supplier *</label><select class="select" name="supplierId">${state.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Invoice number *</label><input class="input" name="invoiceNo" required></div><div class="field"><label>Invoice date *</label><input class="input" name="date" type="date" value="${today()}" required></div><div class="field"><label>Invoice total ₹ *</label><input class="input" id="purchaseTotal" name="total" type="number" min="0" step=".01" required oninput="this.dataset.touched='1'"></div><div class="field"><label>Amount paid ₹</label><input class="input" name="paid" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Invoice description</label><input class="input" name="description" placeholder="Optional note"></div></div><div class="divider"></div><div class="panelhead"><div><b>Stock received on this invoice</b><div class="panelhint">Optional, multiple existing product variants can be entered.</div></div><button class="btn small" type="button" onclick="addPurchaseLine()">＋ Add stock line</button></div><div id="purchaseLines"></div><div class="notice" style="margin-top:12px">Saving linked stock lines increases the selected variants, updates the current procurement price and preserves the previous cost in the price history.</div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save invoice</button></div></form>`)}
function addPurchaseLine(){ $('#purchaseLines').insertAdjacentHTML('beforeend',purchaseLineHtml());calcPurchaseTotal() }
function purchaseProductChanged(el){const row=el.closest('.purchase-line'),p=prod(el.value);row.querySelector('[name=variantId]').innerHTML=stockVariantOptionsHtml(p.id);const v=variant(row.querySelector('[name=variantId]').value).v;if(v)row.querySelector('[name=unitCost]').value=v.buy??0;calcPurchaseTotal()}
function calcPurchaseTotal(){let t=0;$$('#purchaseLines .purchase-line').forEach(r=>t+=Number(r.querySelector('[name=qty]').value||0)*Number(r.querySelector('[name=unitCost]').value||0));const el=$('#purchaseTotal');if(el&&!el.dataset.touched)el.value=t.toFixed(2)}
function saveSupplierInvoice(e){e.preventDefault();if(!admin()||!ensureOnline())return;const f=new FormData(e.target),paid=Number(f.get('paid'));const lines=$$('#purchaseLines .purchase-line').map(r=>({productId:r.querySelector('[name=productId]').value,variantId:r.querySelector('[name=variantId]').value,qty:Number(r.querySelector('[name=qty]').value),unitCost:Number(r.querySelector('[name=unitCost]').value)}));if(lines.some(x=>!x.variantId||!Number.isInteger(x.qty)||x.qty<1||x.unitCost<0))return toast('Check purchase stock lines');const lineTotal=lines.reduce((s,x)=>s+x.qty*x.unitCost,0),total=Number(f.get('total')||lineTotal);if(total<0||paid<0||paid>total||total+0.001<lineTotal)return toast('Invoice total must cover linked stock lines and paid amount must be valid');const inv={id:id(),supplierId:String(f.get('supplierId')),invoiceNo:String(f.get('invoiceNo')).trim(),date:String(f.get('date')),total,paid,description:String(f.get('description')),items:lines};for(const x of lines){const found=variant(x.variantId);if(!found.v||found.p.id!==x.productId)return toast('A purchase variant is no longer available');const v=found.v;v.stock+=x.qty;v.costHistory??=[];v.costHistory.push({price:v.buy,at:new Date().toISOString(),by:actor(),invoice:inv.invoiceNo});v.buy=x.unitCost;state.movements.unshift({id:id(),variantId:v.id,productId:found.p.id,qty:x.qty,type:'Supplier purchase receipt',reason:`${inv.invoiceNo} · ${inv.description||'Supplier invoice'}`,by:actor(),at:new Date().toISOString()})}state.supplierInvoices.unshift(inv);const s=state.suppliers.find(x=>x.id===inv.supplierId);log('Supplier invoice recorded',`${s?.name} · ${inv.invoiceNo} · ${rupee(total)}`);persistRender();closeModal();toast('Supplier invoice and linked stock saved')}
function openSupplierDetail(sid){const s=state.suppliers.find(x=>x.id===sid);if(!s)return;const inv=state.supplierInvoices.filter(x=>x.supplierId===sid);openModal(`<div class="modalhead"><div><h2>${esc(s.name)}</h2><div class="sub">${esc(s.phone||'No phone')} · ${esc(s.address||'No address')}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div><div class="tiny muted">Email</div><b>${esc(s.email||'—')}</b></div><div><div class="tiny muted">Outstanding</div><b>${rupee(inv.reduce((n,x)=>n+Math.max(0,x.total-x.paid),0))}</b></div></div><div class="divider"></div><b>Purchase invoices</b>${inv.length?inv.map(x=>`<div class="listitem"><div class="listgrow"><div class="listtitle">${esc(x.invoiceNo)} · ${fmtDate(x.date)}</div><div class="listdesc">${esc(x.description||'Purchase invoice')} · Paid ${rupee(x.paid)} / ${rupee(x.total)}</div></div><div style="text-align:right"><b>${rupee(Math.max(0,x.total-x.paid))}</b><button class="btn small" onclick="recordSupplierPayment('${x.id}')">Record payment</button></div></div>`).join(''):'<div class="empty">No invoices recorded.</div>'}<div class="modalactions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="openSupplierInvoiceFor('${sid}')">＋ Add invoice</button></div>`)}
function openSupplierInvoiceFor(sid){closeModal();openSupplierInvoice();setTimeout(()=>{const s=$('[name=supplierId]');if(s)s.value=sid},0)}
function recordSupplierPayment(iid){if(!admin())return;const x=state.supplierInvoices.find(a=>a.id===iid);if(!x)return;const due=x.total-x.paid;if(due<=0)return toast('Invoice is fully paid');openModal(`<div class="modalhead"><div><h2>Record supplier payment</h2><div class="sub">${esc(x.invoiceNo)} · Outstanding ${rupee(due)}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSupplierPayment(event,'${iid}')"><div class="field"><label>Payment amount ₹</label><input class="input" name="amount" type="number" step=".01" min=".01" max="${due}" required></div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Record payment</button></div></form>`)}
function saveSupplierPayment(e,iid){e.preventDefault();const x=state.supplierInvoices.find(a=>a.id===iid),n=Number(new FormData(e.target).get('amount'));if(!x||n<=0||n>x.total-x.paid)return toast('Invalid payment amount');x.paid+=n;log('Supplier payment recorded',`${x.invoiceNo} · ${rupee(n)}`);persistRender();closeModal();toast('Supplier payment recorded')}
function cashbookPage(){if(!admin())return accessDenied();const rows=cashbookRows();const totalIn=rows.filter(x=>x.type==='Collection').reduce((s,x)=>s+x.amount,0),totalOut=rows.filter(x=>x.type==='Expense').reduce((s,x)=>s+x.amount,0);return `${header('Cashbook','Admin-only record of Cash/UPI bill collections and shop expenses.',`<button class="btn primary" onclick="openExpenseForm()">＋ Add expense</button>`)}${presetBar(cashPreset,'cash')}<div class="cards"><div class="metric"><div class="metriclabel">Collections</div><div class="metricvalue">${rupee(totalIn)}</div><div class="metrichint">From posted paper bills</div></div><div class="metric"><div class="metriclabel">Shop expenses</div><div class="metricvalue">${rupee(totalOut)}</div><div class="metrichint">Manually recorded by Admin</div></div><div class="metric"><div class="metriclabel">Cash collected</div><div class="metricvalue">${rupee(rows.filter(x=>x.type==='Collection'&&x.method==='Cash').reduce((s,x)=>s+x.amount,0))}</div></div><div class="metric"><div class="metriclabel">UPI collected</div><div class="metricvalue">${rupee(rows.filter(x=>x.type==='Collection'&&x.method==='UPI').reduce((s,x)=>s+x.amount,0))}</div></div></div><section class="panel"><div class="panelhead"><div><div class="paneltitle">Cashbook transactions</div><div class="panelhint">Bill collections are automatic. Refunds are recorded separately as expenses.</div></div><button class="btn small" onclick="exportCashbook()">Export Excel</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description / bill</th><th>Method</th><th>Recorded by</th><th>Amount</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr>${`<td>${fmtDate(x.date)}</td><td><span class="tag ${x.type==='Collection'?'green':'amber'}">${x.type}</span></td><td>${esc(x.description)}</td><td>${esc(x.method)}</td><td>${esc(x.by)}</td><td class="strong">${x.type==='Expense'?'− ':''}${rupee(x.amount)}</td>`}</tr>`).join(''):'<tr><td colspan="6" class="empty">No cashbook transactions for this period.</td></tr>'}</tbody></table></div><div class="notice" style="margin-top:12px">Cashbook scope follows your approved rule: bill collections and general shop expenses. Supplier invoices/payments are tracked separately under Suppliers.</div></section>`}
function cashbookRows(){const bills=billsInRange(cashPreset,window.cashFrom,window.cashTo).filter(b=>b.status==='posted');const rows=[];bills.forEach(b=>{if(b.cash)rows.push({date:b.date,type:'Collection',description:`${b.paperNo} · ${b.customerName}`,method:'Cash',by:nameOf(b.enteredBy),amount:b.cash});if(b.upi)rows.push({date:b.date,type:'Collection',description:`${b.paperNo} · ${b.customerName}`,method:'UPI',by:nameOf(b.enteredBy),amount:b.upi})});state.expenses.filter(x=>{const [a,b]=rangeFor(cashPreset,window.cashFrom,window.cashTo),d=new Date(x.date);return d>=a&&d<=b}).forEach(x=>rows.push({date:x.date,type:'Expense',description:`${x.category} · ${x.description}`,method:x.method,by:x.createdBy,amount:x.amount}));return rows.sort((a,b)=>new Date(b.date)-new Date(a.date))}
function openExpenseForm(){if(!admin())return;openModal(`<div class="modalhead"><div><h2>Add Cashbook expense</h2><div class="sub">Record shop expenses and refunds separately from the original bill correction.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveExpense(event)"><div class="formgrid"><div class="field"><label>Date *</label><input class="input" name="date" type="date" value="${today()}" required></div><div class="field"><label>Category *</label><select class="select" name="category" id="expenseCategory" onchange="toggleCustomExpense(this.value)">${state.expenseCategories.map(x=>`<option>${esc(x)}</option>`).join('')}<option value="__custom">+ Add custom category</option></select></div><div class="field ${state.expenseCategories.includes('Other')?'':'hidden'}" id="customExpenseWrap"><label>Custom category</label><input class="input" name="customCategory"></div><div class="field"><label>Amount ₹ *</label><input class="input" name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Paid through *</label><select class="select" name="method"><option>Cash</option><option>UPI</option></select></div><div class="field full"><label>Description *</label><input class="input" name="description" required placeholder="What was the expense for?"></div></div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save expense</button></div></form>`)}
function toggleCustomExpense(v){const w=$('#customExpenseWrap');if(w)w.classList.toggle('hidden',v!=='__custom')}
function saveExpense(e){e.preventDefault();if(!admin()||!ensureOnline())return;const f=new FormData(e.target);let category=String(f.get('category'));if(category==='__custom'){category=String(f.get('customCategory')||'').trim();if(!category)return toast('Enter custom expense category');if(!state.expenseCategories.includes(category))state.expenseCategories.push(category)}const amount=Number(f.get('amount'));if(amount<=0)return toast('Enter a valid amount');state.expenses.unshift({id:id(),date:String(f.get('date')),category,description:String(f.get('description')),amount,method:String(f.get('method')),createdBy:actor()});log('Cashbook expense added',`${category} · ${rupee(amount)}`);persistRender();closeModal();toast('Expense saved')}
function reportsPage(){const all=billsInRange(reportPreset,window.reportFrom,window.reportTo).filter(b=>b.status==='posted');const selectedEmp=admin()?(window.reportEmployee||'all'):state.employeeId;const arr=admin()&&selectedEmp!=='all'?all.filter(b=>b.soldBy===selectedEmp):admin()?all:all.filter(b=>b.soldBy===state.employeeId);const mt=allMetrics(arr);const top=topProducts(arr);const catRows={};arr.forEach(b=>{const lineSum=b.items.reduce((s,i)=>s+i.qty*i.unitPrice,0)||1;const factor=b.finalAmount/lineSum;b.items.forEach(i=>{catRows[i.categoryName]??={qty:0,sales:0};catRows[i.categoryName].qty+=i.qty;catRows[i.categoryName].sales+=(i.qty*i.unitPrice)*factor})});const stockByCat={};activeProducts().forEach(p=>{const c=cat(p.categoryId)?.name||'Uncategorised';stockByCat[c]??={qty:0,invested:0,potential:0,sizes:{}};activeVariants(p).forEach(v=>{stockByCat[c].qty+=v.stock;stockByCat[c].invested+=v.stock*safecost(v);stockByCat[c].potential+=v.stock*v.sell;stockByCat[c].sizes[v.size||'No size']=(stockByCat[c].sizes[v.size||'No size']||0)+v.stock})});return `${header('Reports','Daily, weekly, monthly and custom-date reports. Select a number to open the supporting records.',`<button class="btn" onclick="exportReport()">↓ Excel</button><button class="btn primary" onclick="printReport()">PDF / Print</button>`)}${presetBar(reportPreset,'report')} ${admin()?`<div class="toolbar"><select class="select compact" onchange="window.reportEmployee=this.value;render()"><option value="all">All employees</option>${state.employees.map(e=>`<option value="${e.id}" ${selectedEmp===e.id?'selected':''}>${esc(e.name)} ${e.active?'':'(Deactivated)'}</option>`).join('')}</select></div>`:''}<div class="cards"><button class="metric" onclick="nav('sales')"><div class="metriclabel">Bills entered</div><div class="metricvalue">${mt.count}</div><div class="metrichint">Tap to open bill register</div></button><button class="metric" onclick="nav('sales')"><div class="metriclabel">Sales value</div><div class="metricvalue">${rupee(mt.amount)}</div><div class="metrichint">Posted paper bills</div></button><button class="metric" onclick="nav('sales')"><div class="metriclabel">Pieces sold</div><div class="metricvalue">${mt.pieces}</div><div class="metrichint">All categories</div></button><button class="metric"><div class="metriclabel">Collections</div><div class="metricvalue">${rupee(mt.cash+mt.upi)}</div><div class="metrichint">Cash ${rupee(mt.cash)} · UPI ${rupee(mt.upi)}</div></button></div>
 <div class="grid2"><section class="panel"><div class="panelhead"><div><div class="paneltitle">Category-wise sales</div><div class="panelhint">Quantity and sales value in the selected period</div></div></div><div class="tablewrap"><table><thead><tr><th>Category</th><th>Pieces sold</th><th>Sales value</th></tr></thead><tbody>${Object.entries(catRows).length?Object.entries(catRows).sort((a,b)=>b[1].qty-a[1].qty).map(([n,x])=>`<tr class="clickrow" onclick="openCategorySales('${encodeURIComponent(n)}')"><td class="strong">${esc(n)}</td><td>${x.qty}</td><td>${rupee(x.sales)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No sales in this period.</td></tr>'}</tbody></table></div></section>
 <section class="panel"><div class="panelhead"><div><div class="paneltitle">Top-selling products</div><div class="panelhint">Ranked by pieces sold</div></div></div>${top.length?top.slice(0,8).map((x,i)=>`<div class="listitem"><div class="avatar">${i+1}</div><div class="listgrow"><div class="listtitle">${esc(x.name)}</div><div class="listdesc">${esc(x.category)}</div></div><b>${x.qty} pcs</b></div>`).join(''):'<div class="empty">No sales yet.</div>'}</section></div>
 <section class="panel"><div class="panelhead"><div><div class="paneltitle">Available inventory by category and size</div><div class="panelhint">Current quantities, not limited to the report date range</div></div><button class="btn small" onclick="nav('inventory')">Open inventory</button></div><div class="tablewrap"><table><thead><tr><th>Category</th><th>Available pieces</th><th>Size breakdown</th>${admin()?'<th>Invested value</th><th>Potential sales value</th>':''}</tr></thead><tbody>${Object.entries(stockByCat).map(([n,x])=>`<tr class="clickrow" onclick="nav('inventory');state.openCats=[catByName('${encodeURIComponent(n)}')].filter(Boolean);render()"><td class="strong">${esc(n)}</td><td>${x.qty}</td><td>${Object.entries(x.sizes).map(([s,q])=>`${esc(s)}: ${q}`).join(' · ')}</td>${admin()?`<td>${rupee(x.invested)}</td><td>${rupee(x.potential)}</td>`:''}</tr>`).join('')}</tbody></table></div>${admin()?`<div class="sumrow total"><span>Total invested value</span><span>${rupee(allInventory().invested)}</span></div><div class="sumrow"><span>Total potential sales value</span><b>${rupee(allInventory().potential)}</b></div>`:''}</section>
 ${admin()?`<section class="panel"><div class="panelhead"><div><div class="paneltitle">Employee sales performance</div><div class="panelhint">Based on paper bills entered in selected period</div></div><button class="btn small" onclick="nav('employees')">Employee details</button></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Bills sold</th><th>Pieces</th><th>Sales value</th></tr></thead><tbody>${state.employees.map(e=>{const eb=arr.filter(b=>b.soldBy===e.id),m=allMetrics(eb);return `<tr><td>${esc(e.name)} ${e.active?'':'<span class="tag gray">Deactivated</span>'}</td><td>${m.count}</td><td>${m.pieces}</td><td>${rupee(m.amount)}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><div class="panelhead"><div><div class="paneltitle">Estimated profitability</div><div class="panelhint">Historical bill cost snapshots where available; estimates exclude lines with missing purchase price.</div></div></div>${profitSummary(arr)}</section>`:`<div class="notice">Sales view is limited to your own bill and quantity summary. Shop-wide costs, invested value and profit reports are Admin-only.</div>`}`}
function profitSummary(arr){let revenue=0,cost=0,known=0;arr.forEach(b=>{revenue+=Number(b.finalAmount||0);b.items.forEach(i=>{if(i.costSnapshot!=null){cost+=i.qty*i.costSnapshot;known+=i.qty}})});const gross=revenue-cost;const dates=rangeFor(reportPreset,window.reportFrom,window.reportTo);const expense=state.expenses.filter(x=>{const d=new Date(x.date);return d>=dates[0]&&d<=dates[1]}).reduce((s,x)=>s+x.amount,0);return `<div class="grid3"><div class="amountbox"><div class="tiny muted">Sales revenue</div><div class="metricvalue" style="font-size:21px">${rupee(revenue)}</div></div><div class="amountbox"><div class="tiny muted">Estimated cost of goods</div><div class="metricvalue" style="font-size:21px">${rupee(cost)}</div></div><div class="amountbox"><div class="tiny muted">Estimated gross profit</div><div class="metricvalue" style="font-size:21px">${rupee(gross)}</div></div></div><div class="sumrow"><span>Shop expenses recorded (all time)</span><b>${rupee(expense)}</b></div><div class="sumrow total"><span>Estimated net operating amount</span><span>${rupee(gross-expense)}</span></div><div class="tiny muted">Known-cost quantity: ${known} pieces. Missing procurement costs are excluded rather than treated as zero.</div>`}
function catByName(encoded){const name=decodeURIComponent(encoded);return state.categories.find(c=>c.name===name)?.id}
function openCategorySales(encoded){const name=decodeURIComponent(encoded);const arr=allPosted().filter(b=>b.items.some(i=>i.categoryName===name));openModal(`<div class="modalhead"><div><h2>${esc(name)} · Sales detail</h2><div class="sub">Bills containing this category</div></div><button class="close" onclick="closeModal()">×</button></div>${arr.length?arr.map(b=>`<div class="listitem" onclick="closeModal();openBillDetail('${b.id}')" style="cursor:pointer"><div class="listgrow"><div class="listtitle">${esc(b.paperNo)} · ${esc(b.customerName)}</div><div class="listdesc">${fmtDate(b.date)} · ${b.items.filter(i=>i.categoryName===name).reduce((s,i)=>s+i.qty,0)} pieces</div></div><b>${rupee(b.finalAmount)}</b></div>`).join(''):'<div class="empty">No supporting bills.</div>'}`)}
function exportReport(){const arr=billsInRange(reportPreset,window.reportFrom,window.reportTo).filter(b=>b.status==='posted').filter(b=>admin()?(!window.reportEmployee||window.reportEmployee==='all'||b.soldBy===window.reportEmployee):b.soldBy===state.employeeId);const rows=arr.map(b=>({PaperBill:b.paperNo,Date:b.date,Customer:b.customerName,Phone:b.phone,SoldBy:nameOf(b.soldBy),EnteredBy:nameOf(b.enteredBy),Category:b.items.map(i=>i.categoryName).join('; '),Categories:[...new Set(b.items.map(i=>i.categoryName))].join('; '),Products:b.items.map(i=>i.productName).join('; '),Pieces:b.items.reduce((s,i)=>s+i.qty,0),Subtotal:b.subtotal,Discount:b.discount,FinalAmount:b.finalAmount,Cash:b.cash,UPI:b.upi}));downloadExcel(rows,'AnantaVastra_Sales_Report')}
function exportBills(){downloadExcel(state.bills.map(b=>({PaperBill:b.paperNo,Date:b.date,Customer:b.customerName,Phone:b.phone,SoldBy:nameOf(b.soldBy),EnteredBy:nameOf(b.enteredBy),Amount:b.finalAmount,Status:b.status,Payment:paymentLabel(b)})),'AnantaVastra_Bill_Register')}
function exportCashbook(){const rows=cashbookRows().map(x=>({Date:x.date,Type:x.type,Description:x.description,Method:x.method,RecordedBy:x.by,Amount:x.amount}));downloadExcel(rows,'AnantaVastra_Cashbook')}
function exportCustomers(){const rows=customerGroups().map(c=>({Phone:c.phone,Names:c.names.join(' | '),Bills:c.bills.length,PurchaseValue:c.bills.reduce((s,b)=>s+b.finalAmount,0)}));downloadExcel(rows,'AnantaVastra_Customers')}
function downloadExcel(rows,name){const run=()=>{if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Report');XLSX.writeFile(wb,name+'.xlsx')}else downloadCsvFallback(rows,name)};if(window.XLSX)return run();if(window._xlsxLoading)return window._xlsxLoading.then(run).catch(()=>downloadCsvFallback(rows,name));window._xlsxLoading=new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});window._xlsxLoading.then(run).catch(()=>downloadCsvFallback(rows,name))}
function downloadCsvFallback(rows,name){const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Downloaded Excel-compatible CSV fallback')}
function printReport(){window.print()}
function notificationsPage(){return `${header('Notifications','Admin receives alerts for bill entry, stock activity, low stock and operational events.',admin()?'<button class="btn" onclick="markAllRead()">Mark all read</button>':'')}<div class="panel">${state.notifications.length?state.notifications.map(n=>`<div class="listitem"><div class="avatar">${n.title.toLowerCase().includes('stock')?'▦':'♧'}</div><div class="listgrow"><div class="listtitle">${esc(n.title)} ${n.read?'':'<span class="tag amber">New</span>'}</div><div class="listdesc">${esc(n.body)}</div><div class="tiny muted">${fmtDateTime(n.at)}</div></div>${!n.read?`<button class="btn small" onclick="markRead('${n.id}')">Read</button>`:''}</div>`).join(''):'<div class="empty">No notifications.</div>'}</div><div class="notice">Demo notifications are stored in this browser. Real phone push delivery requires a configured push service and the live backend.</div>`}
function markRead(nid){const n=state.notifications.find(x=>x.id===nid);if(n)n.read=true;persistRender()}
function markAllRead(){state.notifications.forEach(n=>n.read=true);persistRender();toast('All notifications marked as read')}
function employeesPage(){if(!admin())return accessDenied();return `${header('Employee management','One owner/Admin account. Sales employees use individual accounts; deactivation must revoke access and retain history.',`<button class="btn primary" onclick="openEmployeeForm()">＋ Add Sales employee</button>`)}<div class="notice">In the production app, deactivation will revoke active sessions server-side immediately. This prototype simulates the access state only; it does not authenticate real employees.</div><div class="panel"><div class="panelhead"><div><div class="paneltitle">Sales employees</div><div class="panelhint">Employee history is preserved after deactivation.</div></div></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Username</th><th>Status</th><th>Bills sold / entered</th><th>Sales value</th><th>Actions</th></tr></thead><tbody>${state.employees.map(e=>{const bs=state.bills.filter(b=>b.soldBy===e.id||b.enteredBy===e.id),m=allMetrics(bs);return `<tr><td class="strong">${esc(e.name)}</td><td>${esc(e.username)}</td><td><span class="tag ${e.active?'green':'gray'}">${e.active?'Active':'Deactivated'}</span></td><td>${m.count}</td><td>${rupee(m.amount)}</td><td><button class="btn small" onclick="viewEmployeeReport('${e.id}')">Report</button> <button class="btn small" onclick="toggleEmployee('${e.id}')">${e.active?'Deactivate':'Reactivate'}</button></td></tr>`}).join('')}</tbody></table></div></div><div class="panel"><div class="panelhead"><div class="paneltitle">Recent activity log</div><span class="tag">Admin only</span></div>${state.activity.slice(0,15).map(x=>`<div class="listitem"><div class="listgrow"><div class="listtitle">${esc(x.action)}</div><div class="listdesc">${esc(x.detail)} · ${esc(x.by)}</div><div class="tiny muted">${fmtDateTime(x.at)}</div></div></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>`}
function openEmployeeForm(){if(!admin())return;openModal(`<div class="modalhead"><div><h2>Add Sales employee</h2><div class="sub">Production accounts will be provisioned through secure authentication, not stored in this browser.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveEmployee(event)"><div class="formgrid"><div class="field"><label>Employee name *</label><input class="input" name="name" required></div><div class="field"><label>Username *</label><input class="input" name="username" required autocomplete="off"></div></div><div class="notice" style="margin-top:12px">Demo profile only. No password is collected or stored in this prototype. The production Admin will securely create/reset account credentials.</div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Create employee profile</button></div></form>`)}
function saveEmployee(e){e.preventDefault();if(!admin()||!ensureOnline())return;const f=new FormData(e.target),name=String(f.get('name')).trim(),username=String(f.get('username')).trim().toLowerCase();if(state.employees.some(x=>x.username.toLowerCase()===username))return toast('Username already exists');state.employees.push({id:id(),name,username,active:true,joined:today()});log('Employee profile created',`${name} (${username})`);notify('Sales employee added',`${name} can be provisioned in the live authentication system.`);persistRender();closeModal();toast('Employee profile created in demo')}
function toggleEmployee(eid){if(!admin()||!ensureOnline())return;const e=state.employees.find(x=>x.id===eid);if(!e)return;e.active=!e.active;log(e.active?'Employee reactivated':'Employee deactivated',e.name);if(!e.active&&state.role==='sales'&&state.employeeId===eid){state.role='admin';state.employeeId=state.employees.find(x=>x.active)?.id||'';toast(`${e.name} deactivated. Sales preview ended.`)}notify(e.active?'Employee reactivated':'Employee deactivated',`${e.name}'s account is ${e.active?'active':'deactivated'}.`);save();render()}
function viewEmployeeReport(eid){const e=state.employees.find(x=>x.id===eid);if(!e)return;const arr=state.bills.filter(b=>b.soldBy===eid);const m=allMetrics(arr);openModal(`<div class="modalhead"><div><h2>${esc(e.name)} · Sales report</h2><div class="sub">All recorded paper bills associated with this employee</div></div><button class="close" onclick="closeModal()">×</button></div><div class="grid3"><div class="amountbox"><div class="tiny muted">Bills</div><div class="metricvalue">${m.count}</div></div><div class="amountbox"><div class="tiny muted">Pieces</div><div class="metricvalue">${m.pieces}</div></div><div class="amountbox"><div class="tiny muted">Sales</div><div class="metricvalue" style="font-size:19px">${rupee(m.amount)}</div></div></div>${arr.map(b=>`<div class="listitem" onclick="closeModal();openBillDetail('${b.id}')"><div class="listgrow"><div class="listtitle">${esc(b.paperNo)} · ${esc(b.customerName)}</div><div class="listdesc">${fmtDate(b.date)}</div></div><b>${rupee(b.finalAmount)}</b></div>`).join('')||'<div class="empty">No bills recorded.</div>'}`)}
function settingsPage(){if(!admin())return accessDenied();return `${header('Settings','Shop profile, language, category-specific product-code prefixes and demo data controls.',`<button class="btn" onclick="exportBackup()">Export all demo data</button>`)}<section class="panel"><div class="panelhead"><div><div class="paneltitle">Shop profile</div><div class="panelhint">These details appear in the app and can be used on digital reports.</div></div></div><form onsubmit="saveSettings(event)"><div class="formgrid"><div class="field"><label>Shop name</label><input class="input" name="shopName" value="${esc(state.settings.shopName)}" required></div><div class="field"><label>Shop phone number</label><input class="input" name="phone" value="${esc(state.settings.phone)}" placeholder="Shop contact number"></div><div class="field"><label>App language</label><select class="select" name="language"><option value="en" ${state.settings.language==='en'?'selected':''}>English</option><option value="ta" ${state.settings.language==='ta'?'selected':''}>தமிழ் (Tamil)</option></select></div><div class="field"><label>Low-stock notifications</label><select class="select" name="lowStockNotifications"><option value="true" ${state.settings.lowStockNotifications?'selected':''}>Enabled</option><option value="false" ${!state.settings.lowStockNotifications?'selected':''}>Disabled</option></select></div></div><div class="modalactions"><button class="btn primary">Save settings</button></div></form></section>
 <section class="panel"><div class="panelhead"><div><div class="paneltitle">Categories and product-code prefixes</div><div class="panelhint">Prefix settings are inside each category. Changing a prefix affects new products only; existing codes remain unchanged.</div></div><button class="btn small" onclick="openCategoryForm()">＋ Add category</button></div><div class="tablewrap"><table><thead><tr><th>Category</th><th>Product prefix</th><th>Products</th><th>Action</th></tr></thead><tbody>${state.categories.map(c=>`<tr><td class="strong">${esc(c.name)}</td><td><span class="tag">${esc(c.prefix)}</span></td><td>${state.products.filter(p=>p.categoryId===c.id&&!p.archived).length}</td><td><button class="btn small" onclick="editCategory('${c.id}')">Edit</button> <button class="btn small danger" onclick="archiveCategory('${c.id}')">Archive</button></td></tr>`).join('')}</tbody></table></div></section>
 <section class="panel"><div class="panelhead"><div><div class="paneltitle">Notifications and permissions</div><div class="panelhint">Browser permission is only a preview; real push requires the production backend.</div></div></div><button class="btn" onclick="requestBrowserNotifications()">Enable browser notification permission</button><div class="divider"></div><div class="notice">Production safety requirements: Supabase Auth, server-side role enforcement, database Row Level Security, secure session revocation on employee deactivation, audited database transactions, encrypted HTTPS traffic and automated backups. The current demo does not yet provide these live protections.</div></section>
 <section class="panel"><div class="panelhead"><div><div class="paneltitle">Demo data management</div><div class="panelhint">Browser-local sample data only. This is not a live shop database.</div></div></div><div class="toolbar"><button class="btn" onclick="exportBackup()">Download JSON backup</button><button class="btn danger" onclick="resetDemo()">Reset sample data</button></div><div class="tiny muted">Exported data contains demo records. Never enter real customer or financial information into this prototype.</div></section>`}
function saveSettings(e){e.preventDefault();if(!admin()||!ensureOnline())return;const f=new FormData(e.target);state.settings.shopName=String(f.get('shopName'));state.settings.phone=String(f.get('phone'));state.settings.language=String(f.get('language'));state.settings.lowStockNotifications=f.get('lowStockNotifications')==='true';log('Settings updated','Shop profile / language / low-stock settings');persistRender();toast('Settings saved')}
function editCategory(cid){if(!admin())return;const c=cat(cid);if(!c)return;openModal(`<div class="modalhead"><div><h2>Edit category</h2><div class="sub">Existing product codes will not be changed.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveCategoryEdit(event,'${cid}')"><div class="formgrid"><div class="field"><label>Category name</label><input class="input" name="name" value="${esc(c.name)}" required></div><div class="field"><label>New product prefix</label><input class="input" name="prefix" value="${esc(c.prefix)}" required></div></div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save category</button></div></form>`)}
function saveCategoryEdit(e,cid){e.preventDefault();if(!admin()||!ensureOnline())return;const c=cat(cid),f=new FormData(e.target),name=String(f.get('name')).trim(),prefix=String(f.get('prefix')).trim().toUpperCase();if(state.categories.some(x=>x.id!==cid&&x.name.toLowerCase()===name.toLowerCase()))return toast('Category name already exists');if(!/^[A-Z0-9-]+$/.test(prefix))return toast('Invalid prefix');c.name=name;c.prefix=prefix;log('Category settings updated',name+' / '+prefix);persistRender();closeModal()}
function archiveCategory(cid){if(!admin()||!ensureOnline())return;const c=cat(cid);if(!c)return;if(state.products.some(p=>p.categoryId===cid&&!p.archived))return toast('Archive or move all products before archiving this category');if(!confirm(`Archive category ${c.name}? Historical records will remain.`))return;c.active=false;log('Category archived',c.name);persistRender()}
function requestBrowserNotifications(){if(!('Notification'in window))return toast('Browser notifications are not supported here');Notification.requestPermission().then(x=>toast('Browser notification permission: '+x))}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,role:undefined,employeeId:undefined},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AnantaVastra_Demo_Backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(!confirm('Reset all local demo changes and restore sample data?'))return;localStorage.removeItem(STORE);state=seedState();page='home';render();toast('Demo data reset')}
function morePage(){return `${header('More','Additional tools and administration options.')}<div class="quickgrid">${(admin()?[['customers','Customers','Customer names and purchase history'],['suppliers','Suppliers','Invoices and outstanding payments'],['cashbook','Cashbook','Cash/UPI collections and expenses'],['employees','Employees','Accounts and sales history'],['notifications','Notifications','Shop activity and alerts'],['settings','Settings','Categories, prefixes and app settings']]:[['customers','Customers','Customer contacts (no purchase history)'],['notifications','Notifications','Your activity alerts']]).map(([p,n,d])=>`<button class="quick" onclick="nav('${p}')">${n}<span>${d}</span></button>`).join('')}</div><section class="panel sectiongap"><div class="paneltitle">Current preview account</div><div class="listitem"><div class="avatar">${admin()?'A':esc(employee().name.slice(0,1))}</div><div class="listgrow"><div class="listtitle">${admin()?'Owner / Admin':esc(employee().name)}</div><div class="listdesc">${admin()?'Single owner account preview':'Sales employee preview'} · Sample data</div></div><span class="tag amber">Demo mode</span></div><div class="tiny muted">Role switching is provided only to review both sets of screens. It is not real authentication.</div></section>`}
function accessDenied(){return `${header('Restricted area','This section is available to the owner/Admin account only.')}<div class="notice red">Sales access is restricted for this module. Switch to Admin preview to review the screen.</div><button class="btn primary" onclick="setRole('admin')">Switch to Admin preview</button>`}
function updateShell(){const rs=$('#roleSelect');if(rs)rs.value=state.role;const ls=$('#langSelect');if(ls)ls.value=state.settings.language||'en';const es=$('#employeeSelect');if(es){es.classList.toggle('hidden',admin());es.innerHTML=employeeOptions(state.employeeId);es.value=state.employeeId}$$('.admin-only').forEach(el=>el.classList.toggle('hidden',!admin()));$$('.navbtn,.mobilebar button').forEach(el=>el.classList.toggle('active',el.dataset.page===page||(page==='more'&&el.dataset.page==='more')));const n=state.notifications.filter(x=>!x.read).length;$('#navNotifCount').textContent=n;$('#navNotifCount').classList.toggle('hidden',!n);const bar=$('#onlinebar');bar.classList.toggle('offline',!navigator.onLine);bar.textContent=navigator.onLine?'● Online preview · Demo data stays in this browser only':'● Offline · App is read-only. Physical bill pad can continue; app entries require internet.'}
function render(){updateShell();const main=$('#main');switch(page){case'home':main.innerHTML=home();break;case'inventory':main.innerHTML=inventoryPage();break;case'sales':main.innerHTML=salesPage();break;case'customers':main.innerHTML=customersPage();break;case'suppliers':main.innerHTML=suppliersPage();break;case'cashbook':main.innerHTML=cashbookPage();break;case'reports':main.innerHTML=reportsPage();break;case'notifications':main.innerHTML=notificationsPage();break;case'employees':main.innerHTML=employeesPage();break;case'settings':main.innerHTML=settingsPage();break;case'more':main.innerHTML=morePage();break;default:page='home';main.innerHTML=home()}applyLanguage();updateShell()}
const translations={ta:{home:'முகப்பு',inventory:'சரக்கு',sales:'விற்பனை மற்றும் பதிவுகள்',customers:'வாடிக்கையாளர்கள்',reports:'அறிக்கைகள்',notifications:'அறிவிப்புகள்',cashbook:'கணக்குப் புத்தகம்',suppliers:'வழங்குநர்கள்',employees:'பணியாளர்கள்',settings:'அமைப்புகள்',page:{home:'முகப்பு',inventory:'சரக்கு',sales:'விற்பனை மற்றும் ரசீதுகள்',customers:'வாடிக்கையாளர்கள்',suppliers:'வழங்குநர்கள்',cashbook:'கணக்குப் புத்தகம்',reports:'அறிக்கைகள்',notifications:'அறிவிப்புகள்',employees:'பணியாளர்கள்',settings:'அமைப்புகள்',more:'மேலும்'}}};
function applyLanguage(){const ta=state.settings.language==='ta';document.documentElement.lang=ta?'ta':'en';if(!ta)return;$$('[data-t]').forEach(el=>{const k=el.dataset.t;if(translations.ta[k])el.textContent=translations.ta[k]});const h=$('#main .h1');if(h&&translations.ta.page[page])h.textContent=translations.ta.page[page]}
function renderMoreFromNav(){nav('more')}
function downloadCSV(rows,name){downloadExcel(rows,name)}
function init(){
 $('#roleSelect').addEventListener('change',e=>setRole(e.target.value));$('#langSelect').addEventListener('change',e=>{state.settings.language=e.target.value;save();render()});$('#employeeSelect').addEventListener('change',e=>{const emp=state.employees.find(x=>x.id===e.target.value);if(!emp?.active){toast('This employee is deactivated');return}state.employeeId=e.target.value;save();render()});$('#notifyTop').addEventListener('click',()=>nav('notifications'));
 document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){nav(b.dataset.page);return}});
 $('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('online',updateShell);window.addEventListener('offline',updateShell);
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
 render();
}
init();
</script>
</body></html>
