function activeProducts(){return state.products.filter(p=>!p.archived)}

function vLabel(v){return [v.color,v.size].filter(Boolean).join(' / ')||'No colour / no size'}

function rangeFor(preset,customFrom='',customTo=''){
 const d=new Date();let from=new Date(d),to=new Date(d);if(preset==='week'){const day=(d.getDay()+6)%7;from.setDate(d.getDate()-day)}else if(preset==='month'){from.setDate(1)}else if(preset==='custom'){from=new Date(customFrom+'T00:00:00');to=new Date((customTo||customFrom)+'T23:59:59')}from.setHours(0,0,0,0);to.setHours(23,59,59,999);return [from,to]
}

function billsInRange(preset,from,to){const [a,b]=rangeFor(preset,from,to);return state.bills.filter(x=>{const d=new Date(x.date);return d>=a&&d<=b})}

function allInventory(){const vars=activeProducts().flatMap(p=>activeVariants(p).map(v=>({p,v})));return {pieces:vars.reduce((s,x)=>s+x.v.stock,0),invested:vars.reduce((s,x)=>s+safecost(x.v)*x.v.stock,0),potential:vars.reduce((s,x)=>s+x.v.sell*x.v.stock,0),low:vars.filter(x=>x.v.stock<=x.v.min).length,products:activeProducts().length}}

function greeting(){const h=Number(istParts().hour);return h<12?'morning':h<17?'afternoon':'evening'}

function inventoryBody(q=''){const cats=state.categories.filter(c=>c.active&&(`${c.name} ${c.prefix}`.toLowerCase().includes(q)||state.products.some(p=>p.categoryId===c.id&&(`${p.name} ${p.code}`.toLowerCase().includes(q)))));if(!cats.length)return '<div class="empty">No matching categories or products.</div>';return cats.map(c=>{const ps=activeProducts().filter(p=>p.categoryId===c.id&&(!q||(`${p.name} ${p.code}`.toLowerCase().includes(q))));const vars=ps.flatMap(p=>activeVariants(p));const qty=vars.reduce((s,v)=>s+v.stock,0),sizes={};vars.forEach(v=>sizes[v.size||'No size']=(sizes[v.size||'No size']||0)+v.stock);const open=state.openCats.includes(c.id)||!!q;return `<section class="categorycard ${open?'open':''}" id="cat-${c.id}"><div class="categoryhead" onclick="toggleCategory('${c.id}')"><div><div class="catname">${esc(c.name)}</div><div class="catmeta">Prefix ${esc(c.prefix)} · ${ps.length} products · ${Object.keys(sizes).length} size groups</div></div><div class="catright"><div class="catqty">${qty} <span class="tiny muted">pcs</span></div><div class="catmeta">${open?'Tap to collapse':'Tap to view products'}　⌄</div></div></div><div class="categorybody"><div class="toolbar" style="margin:2px 0 8px"><span class="tiny muted">Size-wise total:</span>${Object.entries(sizes).map(([s,n])=>`<span class="tag">${esc(s)} · ${n}</span>`).join('')}</div>${ps.length?ps.map(p=>productCard(p)).join(''):'<div class="empty">No products in this category yet.</div>'}</div></section>`}).join('')}
function productCard(p){const total=activeVariants(p).reduce((s,v)=>s+v.stock,0),inv=activeVariants(p);return `<div class="productcard"><div class="producthead"><div class="productinfo"><div class="producttitle">${esc(p.name)} <span class="tag">${esc(p.code)}</span></div><div class="productsub">${esc(p.note||'No product note')} · ${total} pieces available</div></div><div class="toolbar" style="margin:0;justify-content:flex-end">${admin()?`<button class="btn small" onclick="openProductEdit('${p.id}')">Edit</button><button class="btn small" onclick="openVariantForm('${p.id}')">＋ Variant</button><button class="btn small" onclick="archiveProduct('${p.id}')">Archive</button>`:`<button class="btn small primary" onclick="openStockForm('${p.id}')">＋ Add stock</button>`}</div></div><div class="varianttable"><table><thead><tr><th>Size</th><th>Colour</th><th>Available</th><th>Min stock</th><th>Selling price</th>${admin()?'<th>Purchase price</th><th>Invested</th><th>Potential</th>':''}</tr></thead><tbody>${inv.map(v=>`<tr><td>${esc(v.size||'—')}</td><td>${esc(v.color||'—')}</td><td class="${v.stock<=v.min?'low':'strong'}">${v.stock}</td><td>${v.min}</td><td>${rupee(v.sell)}</td>${admin()?`<td>${v.buy==null?'<span class="tag amber">Pending</span>':rupee(v.buy)}</td><td>${v.buy==null?'—':rupee(v.buy*v.stock)}</td><td>${rupee(v.sell*v.stock)}</td>`:''}</tr>`).join('')}</tbody></table></div></div>`}
function renderInventoryBody(){const el=$('#inventoryBody');if(el)el.innerHTML=inventoryBody((window.invSearch||'').toLowerCase())}

function openProductForm(){if(!admin())return toast('Only Admin can create products');if(!state.categories.some(c=>c.active))return toast('Create a category first');openModal(`<div class="modalhead"><div><h2>Create product</h2><div class="sub">Admin-only product setup. Sales can later add stock to these existing variants.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProduct(event)"><div class="formgrid"><div class="field"><label>Product / design name *</label><input class="input" name="name" required placeholder="e.g. Floral Cotton Chudi"></div><div class="field"><label>Category *</label><select class="select" name="categoryId" required onchange="updateCodePrefix(this.value)">${state.categories.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.prefix)}</option>`).join('')}</select></div><div class="field"><label>Product code suffix *</label><div style="display:flex;gap:6px"><span class="tag" id="codePrefixTag">${esc(state.categories.find(c=>c.active)?.prefix||'')}</span><input class="input" name="suffix" inputmode="numeric" pattern="[0-9]+" required placeholder="00125"></div></div><div class="field"><label>Product photo (optional)</label><input class="input" type="file" name="photo" accept="image/*"></div><div class="field full"><label>Design / fabric notes</label><input class="input" name="note" placeholder="Optional product description"></div></div><div class="divider"></div><div class="panelhead"><div><b>Initial variants and stock</b><div class="panelhint">Colour and size are optional. Add at least one variant.</div></div><button type="button" class="btn small" onclick="addVariantSetupRow()">＋ Add variant</button></div><div id="setupVariants">${variantSetupRow()}</div><div class="notice" style="margin-top:12px">Procurement price and minimum stock threshold are set separately for each variant. This product becomes available to Sales after saving.</div><div class="modalactions"><button class= async function saveProduct(e){e.preventDefault();if(!admin()||!ensureOnline())return;const f=new FormData(e.target),name=String(f.get('name')).trim(),cid=String(f.get('categoryId')),c=cat(cid),suffix=String(f.get('suffix')).trim();if(!c||!name||!suffix)return toast('Complete required product fields');const code=c.prefix+suffix;if(state.products.some(p=>p.code.toLowerCase()===code.toLowerCase()))return toast('Product code already exists');const rows=$$('#setupVariants .variantformrow');if(!rows.length)return toast('Add at least one variant');const variants=rows.map(r=>({id:id(),color:r.querySelector('[name=color]').value.trim(),size:r.querySelector('[name=size]').value.trim(),stock:Number(r.querySelector('[name=qty]').value),sell:Number(r.querySelector('[name=sell]').value),buy:r.querySelector('[name=buy]').value===''?null:Number(r.querySelector('[name=buy]').value),min:Number(r.querySelector('[name=min]').value),damaged:0,pending:0,active:true}));if(variants.some(v=>v.stock<0||v.sell<=0||v.min<0||(v.buy!==null&&v.buy<0)))return toast('Check variant quantities and prices');const keys=variants.map(v=>(v.color+'|'+v.size).toLowerCase());if(new Set(keys).size!==keys.length)return toast('Duplicate colour/size combination');let photo='';const file=e.target.photo.files[0];if(file){photo=await resizeImage(file).catch(()=> '')}const p={id:id(),categoryId:cid,name,code,note:String(f.get('note')||''),photo,archived:false,createdAt:new Date().toISOString(),variants};state.products.unshift(p);variants.forEach(v=>{if(v.stock)state.movements.unshift({id:id(),variantId:v.id,productId:p.id,qty:v.stock,type:'Opening stock',reason:'Product created by Admin',by:actor(),at:new Date().toISOString()})});log('Product created',`${name} (${code})`);notify('New product created',`${name} · ${code} is now available in Sales stock entry.`);persistRender();closeModal();toast('Product created and added to inventory')}
function resizeImage(file){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,480/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=()=>resolve('');im.src=r.result};r.onerror=()=>resolve('');r.readAsDataURL(file)})}
function openProductEdit(pid){if(!admin())return;const p=prod(pid);if(!p)return;openModal(`<div class="modalhead"><div><h2>Edit product</h2><div class="sub">${esc(p.code)} · Update structure and variant pricing. Stock changes are separately audited.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProductEdit(event,'${p.id}')"><div class="formgrid"><div class="field"><label>Product name</label><input class="input" name="name" required value="${esc(p.name)}"></div><div class="field"><label>Category</label><select class="select" name="categoryId">${state.categories.filter(c=>c.active).map(c=>`<option value="${c.id}" ${c.id===p.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><input class="input" name="note" value="${esc(p.note||'')}"></div></div><div class="divider"></div><b>Variant pricing and threshold</b><div id="editVariants">${activeVariants(p).map(v=>`<div class="variantformrow" data-vid="${v.id}"><div class="field"><label>Colour</label><input class="input" name="color" value="${esc(v.color)}"></div><div class="field"><label>Size</label><input class="input" name="size" value="${esc(v.size)}"></div><div class="field"><label>Sell ₹</label><input class="input" name="sell" type="number" min=".01" step=".01" value="${v.sell}"></div><div class="field"><label>Purchase ₹</label><input class="input" name="buy" type="number" min="0" step=".01" value="${v.buy??''}" placeholder="Pending"></div><div class="field"><label>Low at</label><input class="input" name="min" type="number" min="0" value="${v.min}"></div><div class="field"><label>Qty</label><input class="input" value="${v.stock}" disabled></div><button type="button" class="btn small danger" onclick="archiveVariant('${p.id}','${v.id}')">Archive</button></div>`).join('')}</div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save changes</button></div></form>`)}
function saveProductEdit(e,pid){e.preventDefault();if(!admin()||!ensureOnline())return;const p=prod(pid),f=new FormData(e.target);if(!p)return;const oldCategory=p.categoryId;p.name=String(f.get('name')).trim();p.categoryId=String(f.get('categoryId'));p.note=String(f.get('note')||'');$$('#editVariants .variantformrow').forEach(r=>{const v=p.variants.find(x=>x.id===r.dataset.vid);if(!v)return;const oldBuy=v.buy;v.color=r.querySelector('[name=color]').value.trim();v.size=r.querySelector('[name=size]').value.trim();v.sell=Number(r.querySelector('[name=sell]').value);v.buy=r.querySelector('[name=buy]').value===''?null:Number(r.querySelector('[name=buy]').value);v.min=Number(r.querySelector('[name=min]').value);if(v.buy!==oldBuy){v.costHistory??=[];v.costHistory.push({price:v.buy,at:new Date().toISOString(),by:actor()})}});if(oldCategory!==p.categoryId){toast('Category moved. Existing product code retained.')}log('Product edited',`${p.name} · ${p.code}`);persistRender();closeModal();toast('Product details updated')}

function saveVariant(e,pid){e.preventDefault();if(!admin()||!ensureOnline())return;const p=prod(pid),f=new FormData(e.target);const v={id:id(),color:String(f.get('color')||'').trim(),size:String(f.get('size')||'').trim(),stock:Number(f.get('qty')),sell:Number(f.get('sell')),buy:f.get('buy')===''?null:Number(f.get('buy')),min:Number(f.get('min')),damaged:0,pending:0,active:true};if(p.variants.some(x=>x.active!==false&&x.color.toLowerCase()===v.color.toLowerCase()&&x.size.toLowerCase()===v.size.toLowerCase()))return toast('Variant already exists');if(v.stock<0||v.sell<=0||v.min<0)return toast('Check quantities and prices');p.variants.push(v);if(v.stock)state.movements.unshift({id:id(),variantId:v.id,productId:p.id,qty:v.stock,type:'Variant opening stock',reason:'New variant created',by:actor(),at:new Date().toISOString()});log('Variant created',p.name+' · '+vLabel(v));notify('New inventory variant',`${p.name} · ${vLabel(v)} added by Admin.`);persistRender();closeModal();toast('Variant created')}
function openStockForm(pid=''){const products=activeProducts();if(!products.length)return toast('Admin must create products first');openModal(`<div class="modalhead"><div><h2>Add stock</h2><div class="sub">Sales can add quantities only to variants already created by Admin.</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveStock(event)"><div class="formgrid"><div class="field"><label>Product *</label><select class="select" name="productId" id="stockProduct" required onchange="stockVariantOptions()">${products.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)} · ${esc(p.code)}</option>`).join('')}</select></div><div class="field"><label>Variant *</label><select class="select" name="variantId" id="stockVariant" required>${stockVariantOptionsHtml(pid||products[0].id)}</select></div><div class="field"><label>Quantity to add *</label><input class="input" name="qty" type="number" min="1" step="1" required></div><div class="field"><label>Reason *</label><select class="select" name="reason"><option>New stock received</option><option>Opening stock</option><option>Supplier delivery</option><option>Other</option></select></div>${admin()?`<div class="field"><label>New purchase price (optional)</label><input class="input" name="buy" type="number" min="0" step=".01" placeholder="Admin only"></div>`:''}<div class="field full"><label>Notes</label><input class="input" name="notes" placeholder="Optional reference / supplier note"></div></div><div class="notice" style="margin-top:12px">Sales stock additions record the quantity and reason. Procurement cost and supplier details are completed by Admin.</div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save stock entry</button></div></form>`)}

function saveStock(e){e.preventDefault();if(!ensureOnline())return;const f=new FormData(e.target),p=prod(String(f.get('productId'))),v=p?.variants.find(x=>x.id===String(f.get('variantId'))),qty=Number(f.get('qty'));if(!v||qty<=0||!Number.isInteger(qty))return toast('Enter a valid stock quantity and variant');v.stock+=qty;if(admin()&&f.get('buy')!==''){const price=Number(f.get('buy'));if(price<0)return toast('Invalid procurement price');v.costHistory??=[];v.costHistory.push({price:v.buy,at:new Date().toISOString(),by:actor()});v.buy=price}state.movements.unshift({id:id(),variantId:v.id,productId:p.id,qty,type:'Stock addition',reason:String(f.get('reason')),notes:String(f.get('notes')||''),by:actor(),at:new Date().toISOString()});log('Stock added',`${p.name} · ${vLabel(v)} +${qty}`);if(!admin())notify('Stock added by Sales',`${actor()} added ${qty} pieces to ${p.name} · ${vLabel(v)}.`);persistRender();closeModal();toast('Stock quantity updated')}

 <div id="billTableContainer">${billTable()}</div></section>`}
function visibleBills(){return admin()?state.bills:state.bills.filter(b=>b.enteredBy===state.employeeId||b.soldBy===state.employeeId)}
function billTable(){let arr=visibleBills().filter(b=>{if(billFilter==='posted')return b.status==='posted';if(billFilter==='cancelled')return b.status==='cancelled';if(billFilter==='today')return (b.date||'').slice(0,10)===today()&&b.status==='posted';return true});const s=$('#billSearch')?.value?.toLowerCase()||'';if(s)arr=arr.filter(b=>[b.paperNo,b.customerName,b.phone,b.items.map(i=>i.categoryName).join(' '),nameOf(b.enteredBy),nameOf(b.soldBy)].join(' ').toLowerCase().includes(s));arr.sort((a,b)=>{let x=a[billSort.key]??'',y=b[billSort.key]??'';if(billSort.key==='enteredBy'||billSort.key==='soldBy'){x=nameOf(x);y=nameOf(y)}if(billSort.key==='categoryName'){x=a.items.map(i=>i.categoryName).join(', ');y=b.items.map(i=>i.categoryName).join(', ')}if(billSort.key==='payment'){x=paymentLabel(a);y=paymentLabel(b)}if(billSort.key==='finalAmount'){x=Number(x);y=Number(y)}else{x=String(x).toLowerCase();y=String(y).toLowerCase()}return (x>y?1:x<y?-1:0)*(billSort.dir==='asc'?1:-1)});if(!arr.length)return '<div class="empty">No bills match this filter.</div>';return `<div class="tablewrap"><table><thead><tr>${[['paperNo','Paper bill'],['date','Date'],['categoryName','Category'],['customerName','Customer'],['phone','Contact'],['finalAmount','Amount'],['payment','Payment'],['soldBy','Sold by'],['enteredBy','Entered by']].map(([k,l])=>`<th><button onclick="sortBillsBy('${k}')">${l} ${billSort.key===k?(billSort.dir==='asc'?'↑':'↓'):''}</button></th>`).join('')}<th>Status</th></tr></thead><tbody>${arr.map(b=>`<tr class="clickrow" onclick="openBillDetail('${b.id}')"><td class="strong">${esc(b.paperNo)}</td><td>${fmtDate(b.date)}</td><td>${esc([...new Set(b.items.map(i=>i.categoryName))].join(', '))}</td><td>${esc(b.customerName)}</td><td>${esc(b.phone||'—')}</td><td class="strong">${rupee(b.finalAmount)}</td><td>${esc(paymentLabel(b))}</td><td>${esc(nameOf(b.soldBy))}</td><td>${esc(nameOf(b.enteredBy))}</td><td><span class="tag ${b.status==='posted'?'green':'gray'}">${b.status==='posted'?'Posted':'Cancelled'}</span></td></tr>`).join('')}</tbody></table></div><div class="tiny muted" style="margin-top:8px">${arr.length} records · All timestamps shown in India local time</div>`}
